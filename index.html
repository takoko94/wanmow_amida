<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～杯 推し犬レース</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  position:relative;
  font-family:'Panda',sans-serif;
}

/* 背景 */

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0.05),
      rgba(255,255,255,0.02)
    );
}

/* 共通 */

.screen{
  position:absolute;
  inset:0;
  transition:1s;
}

/* タイトル */

.title{

  position:absolute;

  top:68px;

  width:100%;

  text-align:center;

  z-index:100;
}

.title .miniTitle{

  font-size:28px;

  color:#9a7b68;

  letter-spacing:2px;

  text-shadow:
    0 2px 8px rgba(255,255,255,0.95);

  margin-bottom:10px;
}

.title .mainTitle{

  font-size:76px;

  font-family:'Panda';

  color:#ff8fb0;

  letter-spacing:4px;

  text-shadow:
    0 0 0 #fff,
    0 5px 0 #fff,
    0 10px 25px rgba(255,143,176,0.45);
}

.title p{

  margin-top:12px;

  font-size:26px;

  color:#9a7b68;

  text-shadow:
    0 2px 6px rgba(255,255,255,0.9);
}

/* 紹介画面 */

#intro{

  display:flex;
  align-items:center;
  justify-content:center;

  gap:20px;

  padding-top:265px;
}

/* カード */

.card{

  width:200px;
  height:320px;

  border-radius:36px;

  background:
    rgba(255,255,255,0.82);

  backdrop-filter:blur(8px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 18px 35px rgba(0,0,0,0.15);

  transition:.5s;
}

.card img{

  width:140px;
  height:140px;

  border-radius:999px;

  object-fit:cover;

  border:6px solid white;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.15);
}

.cardName{

  margin-top:18px;

  font-size:30px;

  color:#ff6fae;

  text-align:center;

  line-height:1.15;

  text-shadow:
    0 2px 5px rgba(255,255,255,0.9);
}

/* レース */

#race{
  opacity:0;
  pointer-events:none;
}

.trackArea{

  position:absolute;

  left:70px;

  top:215px;

  width:1140px;
  height:450px;
}

/* ゴール */

.goal{

  position:absolute;

  right:0;
  top:0;

  width:30px;
  height:100%;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      to bottom,
      #ffffff 0px,
      #ffffff 24px,
      #ff8fb0 24px,
      #ff8fb0 48px
    );

  border:3px solid white;

  box-shadow:
    0 0 24px rgba(255,255,255,1),
    0 0 42px rgba(255,143,176,0.9);
}

/* レーン */

.lane{

  position:relative;

  width:100%;
  height:82px;

  margin-bottom:10px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.13);

  overflow:hidden;
}

/* ランナー */

.runner{

  position:absolute;

  left:0;
  top:11px;

  width:64px;
  height:64px;

  border-radius:999px;

  overflow:hidden;

  border:5px solid white;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.18);

  will-change:transform;
}

.runner img{

  width:100%;
  height:100%;

  object-fit:cover;
}

/* START */

#startBtn{

  position:absolute;

  left:50%;
  bottom:28px;

  transform:translateX(-50%);

  width:280px;
  height:78px;

  border:none;
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ffbfd7,
      #ffd98c
    );

  color:white;

  font-size:36px;

  font-family:'Panda',sans-serif;

  cursor:pointer;

  z-index:300;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.2);
}

/* 結果 */

#winnerScreen{

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    rgba(255,255,255,0.28);

  backdrop-filter:blur(10px);

  opacity:0;
  pointer-events:none;

  transition:1s;

  z-index:500;
}

#winnerScreen.show{
  opacity:1;
}

#winnerScreen img{

  width:220px;
  height:220px;

  border-radius:999px;

  object-fit:cover;

  border:10px solid white;

  box-shadow:
    0 0 40px gold;
}

#winnerScreen h1{

  margin-top:24px;

  font-size:120px;

  color:#ffbf00;

  text-shadow:
    0 0 20px white,
    0 0 40px gold;
}

#winnerScreen h2{

  margin-top:-10px;

  font-size:82px;

  color:#ff9800;
}

#winnerScreen p{

  margin-top:8px;

  font-size:42px;

  color:#5d5752;
}

/* 紙吹雪 */

.confetti{

  position:absolute;

  width:14px;
  height:14px;

  border-radius:4px;

  animation:fall linear forwards;
}

@keyframes fall{

  0%{
    transform:
      translateY(-100px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(900px)
      rotate(720deg);
  }
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">
<div class="overlay"></div>

<!-- 紹介 -->

<div class="screen" id="introScreen">

  <div class="title">

    <div class="miniTitle">
      クッキー化になるのはどのわんちゃんだ!?
    </div>

    <div class="mainTitle">
      わんも～推し犬レース!!
    </div>

    <p>出走メンバー紹介</p>

  </div>

  <div id="intro">

    <div class="card">
      <img src="dachs.png">
      <div class="cardName">
        ダックスフンド
      </div>
    </div>

    <div class="card">
      <img src="schna.png">
      <div class="cardName">
        シュナウザー
      </div>
    </div>

    <div class="card">
      <img src="maltipoo.png">
      <div class="cardName">
        マルプー
      </div>
    </div>

    <div class="card">
      <img src="shiba.png">
      <div class="cardName">
        柴犬
      </div>
    </div>

    <div class="card">
      <img src="cavalier.png">
      <div class="cardName">
        キャバリア
      </div>
    </div>

  </div>

</div>

<!-- レース -->

<div class="screen" id="race">

  <div class="title">

    <div class="miniTitle">
      クッキー化になるのはどのわんちゃんだ!?
    </div>

    <div class="mainTitle">
      わんも～推し犬レース!!
    </div>

  </div>

  <div class="trackArea">

    <div class="goal"></div>

    <div class="lane">
      <div class="runner" id="dachs">
        <img src="dachs.png">
      </div>
    </div>

    <div class="lane">
      <div class="runner" id="schna">
        <img src="schna.png">
      </div>
    </div>

    <div class="lane">
      <div class="runner" id="maltipoo">
        <img src="maltipoo.png">
      </div>
    </div>

    <div class="lane">
      <div class="runner" id="shiba">
        <img src="shiba.png">
      </div>
    </div>

    <div class="lane">
      <div class="runner" id="cavalier">
        <img src="cavalier.png">
      </div>
    </div>

  </div>

</div>

<!-- 結果 -->

<div id="winnerScreen">

  <img src="shiba.png">

  <h1>🥇</h1>

  <h2>
    柴犬
  </h2>

  <p>
    22人
  </p>

</div>

<button id="startBtn">
START
</button>

<script>

const dogs = [

{
  id:'dachs',
  x:0,
  speed:0.42,
  final:760
},

{
  id:'schna',
  x:0,
  speed:0.47,
  final:850
},

{
  id:'maltipoo',
  x:0,
  speed:0.52,
  final:930
},

{
  id:'cavalier',
  x:0,
  speed:0.57,
  final:1020
},

{
  id:'shiba',
  x:0,
  speed:0.54,
  final:1080
}

];

let running = false;

document
.getElementById('startBtn')
.onclick = async()=>{

  document
  .getElementById('startBtn')
  .style.display='none';

  await sleep(2800);

  document
  .getElementById('introScreen')
  .style.opacity='0';

  await sleep(1200);

  const race =
  document.getElementById('race');

  race.style.opacity='1';
  race.style.pointerEvents='auto';

  running = true;

  animate();
};

function animate(){

  if(!running)return;

  let finished = 0;

  dogs.forEach((d,index)=>{

    const el =
    document.getElementById(d.id);

    if(
      d.id==='shiba'
      && d.x > 760
    ){
      d.speed += 0.0012;
    }

    d.speed +=
      (Math.random()-0.5)*0.004;

    d.speed =
      Math.max(0.36,d.speed);

    d.x += d.speed;

    if(d.x >= d.final){

      d.x = d.final;
      finished++;
    }

    el.style.transform =
    `
    translateX(${d.x}px)
    translateY(${Math.sin(Date.now()/180 + index)*2}px)
    `;
  });

  if(finished >= dogs.length){

    finishRace();

    return;
  }

  requestAnimationFrame(animate);
}

async function finishRace(){

  running = false;

  confetti();

  await sleep(1500);

  document
  .getElementById('winnerScreen')
  .classList.add('show');
}

function confetti(){

  for(let i=0;i<180;i++){

    const c =
    document.createElement('div');

    c.className='confetti';

    c.style.left =
      Math.random()*1280+'px';

    c.style.background =
      `hsl(${Math.random()*360},90%,70%)`;

    c.style.animationDuration =
      (3 + Math.random()*3)+'s';

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },6000);
  }
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
