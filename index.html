<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～杯 推し犬レース</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  position:relative;
  font-family:'Panda',sans-serif;
  background:#f7e0b2;
}

/* 背景 */

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.03)
    );
}

/* タイトル */

.title{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  z-index:100;
}

.title h1{
  font-size:64px;

  color:#ff8eb5;

  text-shadow:
    0 0 10px rgba(255,255,255,0.95),
    0 0 24px rgba(255,255,255,0.9);
}

.title p{
  margin-top:2px;
  font-size:24px;
  color:#8d8378;
}

/* 紹介 */

#introScreen{

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:1s;

  z-index:200;
}

.introIcons{

  display:flex;
  gap:30px;
}

.introDog{

  display:flex;
  flex-direction:column;
  align-items:center;
}

.introDog img{

  width:140px;
  height:140px;

  border-radius:999px;

  object-fit:cover;

  border:7px solid white;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.18);

  animation:
    float 3s ease-in-out infinite;
}

.introDog:nth-child(2) img{
  animation-delay:.4s;
}

.introDog:nth-child(3) img{
  animation-delay:.8s;
}

.introDog:nth-child(4) img{
  animation-delay:1.2s;
}

.introDog:nth-child(5) img{
  animation-delay:1.6s;
}

@keyframes float{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-12px);
  }

  100%{
    transform:translateY(0px);
  }
}

.introDog span{

  margin-top:16px;

  font-size:28px;

  color:white;

  text-shadow:
    0 0 12px rgba(0,0,0,0.35);
}

/* レース */

.trackArea{

  position:absolute;

  left:60px;
  top:130px;

  width:1160px;
  height:500px;
}

/* ゴール */

.goal{

  position:absolute;

  right:0;
  top:0;

  width:36px;
  height:100%;

  border-radius:12px;

  background:
    repeating-linear-gradient(
      45deg,
      #ffffff 0px,
      #ffffff 20px,
      #ff8eb5 20px,
      #ff8eb5 40px
    );

  border:
    4px solid rgba(255,255,255,0.9);

  box-shadow:
    0 0 24px rgba(255,255,255,0.95);
}

/* レーン */

.lane{

  position:relative;

  width:100%;
  height:90px;

  margin-bottom:10px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.14);

  overflow:hidden;

  backdrop-filter:blur(4px);
}

.lane::after{

  content:'';

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:3px;

  background:
    rgba(255,255,255,0.22);
}

/* 距離線 */

.mark{

  position:absolute;
  top:12px;

  width:3px;
  height:66px;

  background:
    rgba(255,255,255,0.14);
}

/* ランナー */

.runner{

  position:absolute;

  left:0;
  top:11px;

  width:64px;
  height:64px;

  border-radius:999px;

  overflow:hidden;

  border:5px solid white;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.18);

  will-change:transform;
}

.runner img{

  width:100%;
  height:100%;

  object-fit:cover;
}

/* START */

#startBtn{

  position:absolute;

  left:50%;
  bottom:28px;

  transform:translateX(-50%);

  width:280px;
  height:78px;

  border:none;
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ffbfd7,
      #ffd98c
    );

  color:white;

  font-size:36px;

  font-family:'Panda',sans-serif;

  cursor:pointer;

  z-index:300;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.2);
}

/* WINNER */

#winnerScreen{

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    rgba(255,255,255,0.24);

  backdrop-filter:blur(10px);

  opacity:0;
  pointer-events:none;

  transition:1s;

  z-index:500;
}

#winnerScreen.show{
  opacity:1;
}

#winnerScreen img{

  width:220px;
  height:220px;

  border-radius:999px;

  object-fit:cover;

  border:10px solid white;

  box-shadow:
    0 0 40px gold;
}

#winnerScreen h1{

  margin-top:24px;

  font-size:120px;

  color:#ffbf00;

  text-shadow:
    0 0 20px white,
    0 0 40px gold;
}

#winnerScreen h2{

  margin-top:-10px;

  font-size:82px;

  color:#ff9800;
}

#winnerScreen p{

  margin-top:8px;

  font-size:42px;

  color:#5d5752;
}

/* 紙吹雪 */

.confetti{

  position:absolute;

  width:14px;
  height:14px;

  border-radius:4px;

  animation:fall linear forwards;
}

@keyframes fall{

  0%{
    transform:
      translateY(-100px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(900px)
      rotate(720deg);
  }
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">
<div class="overlay"></div>

<div class="title">
  <h1>わんも～杯 推し犬レース</h1>
  <p>投票人数ランキング</p>
</div>

<!-- 紹介 -->

<div id="introScreen">

  <div class="introIcons">

    <div class="introDog">
      <img src="dachs.png">
      <span>ダックスフンド</span>
    </div>

    <div class="introDog">
      <img src="schna.png">
      <span>シュナウザー</span>
    </div>

    <div class="introDog">
      <img src="maltipoo.png">
      <span>マルトイプー</span>
    </div>

    <div class="introDog">
      <img src="shiba.png">
      <span>柴犬</span>
    </div>

    <div class="introDog">
      <img src="cavalier.png">
      <span>キャバリア</span>
    </div>

  </div>

</div>

<!-- レース -->

<div class="trackArea">

  <div class="goal"></div>

  <div class="lane">
    <div class="runner" id="dachs">
      <img src="dachs.png">
    </div>
  </div>

  <div class="lane">
    <div class="runner" id="schna">
      <img src="schna.png">
    </div>
  </div>

  <div class="lane">
    <div class="runner" id="maltipoo">
      <img src="maltipoo.png">
    </div>
  </div>

  <div class="lane">
    <div class="runner" id="shiba">
      <img src="shiba.png">
    </div>
  </div>

  <div class="lane">
    <div class="runner" id="cavalier">
      <img src="cavalier.png">
    </div>
  </div>

</div>

<!-- 結果 -->

<div id="winnerScreen">

  <img src="shiba.png">

  <h1>🥇</h1>

  <h2>
    柴犬
  </h2>

  <p>
    22人
  </p>

</div>

<button id="startBtn">
START
</button>

<script>

/* 距離線 */

const trackArea =
document.querySelector('.trackArea');

for(let i=1;i<=10;i++){

  const mark =
  document.createElement('div');

  mark.className='mark';

  mark.style.left =
    (i*100)+'px';

  trackArea.appendChild(mark);
}

/* 犬 */

const dogs = [

{
  id:'dachs',
  x:0,
  speed:0.20,
  final:760
},

{
  id:'schna',
  x:0,
  speed:0.22,
  final:860
},

{
  id:'maltipoo',
  x:0,
  speed:0.24,
  final:940
},

{
  id:'cavalier',
  x:0,
  speed:0.25,
  final:1030
},

{
  id:'shiba',
  x:0,
  speed:0.245,
  final:1080
}

];

let running = false;

/* START */

document
.getElementById('startBtn')
.onclick = async()=>{

  document
  .getElementById('startBtn')
  .style.display='none';

  /* 紹介 */

  await sleep(4000);

  document
  .getElementById('introScreen')
  .style.opacity='0';

  await sleep(1200);

  running = true;

  animate();
};

/* レース */

function animate(){

  if(!running)return;

  let finished = 0;

  dogs.forEach((d,index)=>{

    const el =
    document.getElementById(d.id);

    /* 柴犬ラストスパート */

    if(
      d.id==='shiba'
      && d.x > 760
    ){
      d.speed += 0.0008;
    }

    /* ランダム */

    d.speed +=
      (Math.random()-0.5)*0.008;

    d.speed =
      Math.max(0.18,d.speed);

    d.x += d.speed;

    if(d.x >= d.final){

      d.x = d.final;
      finished++;
    }

    el.style.transform =
    `
    translateX(${d.x}px)
    translateY(${Math.sin(Date.now()/180 + index)*2}px)
    `;
  });

  if(finished >= dogs.length){

    finishRace();

    return;
  }

  requestAnimationFrame(animate);
}

/* 終了 */

async function finishRace(){

  running = false;

  confetti();

  await sleep(1800);

  document
  .getElementById('winnerScreen')
  .classList.add('show');
}

/* 紙吹雪 */

function confetti(){

  for(let i=0;i<180;i++){

    const c =
    document.createElement('div');

    c.className='confetti';

    c.style.left =
      Math.random()*1280+'px';

    c.style.background =
      `hsl(${Math.random()*360},90%,70%)`;

    c.style.animationDuration =
      (3 + Math.random()*3)+'s';

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },6000);
  }
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
