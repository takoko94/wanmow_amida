<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～杯 推し犬レース</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  position:relative;
  font-family:'Panda',sans-serif;
}

/* 背景 */

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.03)
    );
}

/* タイトル */

.title{
  position:absolute;
  top:8px;
  width:100%;
  text-align:center;
  z-index:100;
}

.title h1{
  font-size:64px;

  color:#ff8eb5;

  text-shadow:
    0 0 10px rgba(255,255,255,0.95),
    0 0 24px rgba(255,255,255,0.9);
}

.title p{
  margin-top:2px;
  font-size:24px;
  color:#8d8378;
}

/* レースエリア */

.trackArea{

  position:absolute;

  left:60px;
  top:120px;

  width:1160px;
  height:500px;
}

/* ゴール */

.goal{

  position:absolute;

  right:40px;
  top:0;

  width:20px;
  height:100%;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0px,
      #fff 24px,
      #ffd56a 24px,
      #ffd56a 48px
    );

  box-shadow:
    0 0 20px rgba(255,255,255,0.9);
}

/* レーン */

.lane{

  position:relative;

  width:100%;
  height:90px;

  margin-bottom:10px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.14);

  overflow:hidden;

  backdrop-filter:blur(4px);
}

.lane::after{

  content:'';

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:3px;

  background:
    rgba(255,255,255,0.22);
}

/* 距離線 */

.mark{

  position:absolute;
  top:12px;

  width:3px;
  height:66px;

  background:
    rgba(255,255,255,0.14);
}

.markText{

  position:absolute;

  top:-8px;
  left:-18px;

  color:white;

  font-size:18px;

  opacity:0.55;
}

/* 犬 */

.runner{

  position:absolute;

  left:10px;
  top:8px;

  width:240px;
  height:74px;

  border-radius:999px;

  display:flex;
  align-items:center;

  padding:
    0 18px;

  color:white;

  font-size:28px;

  z-index:30;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.18),
    inset 0 4px 10px rgba(255,255,255,0.35);

  will-change:transform;
}

/* アイコン */

.icon{

  width:60px;
  height:60px;

  border-radius:999px;

  overflow:hidden;

  margin-right:14px;

  flex-shrink:0;

  border:4px solid white;

  box-shadow:
    0 6px 12px rgba(0,0,0,0.15);
}

.icon img{

  width:100%;
  height:100%;

  object-fit:cover;
}

/* 順位 */

.rank{

  position:absolute;

  right:20px;
  top:18px;

  font-size:42px;

  color:white;

  opacity:0;

  transition:.6s;
}

.rank.show{
  opacity:1;
}

/* 脱落 */

.out{

  filter:
    grayscale(1);

  opacity:0.45;
}

/* 優勝 */

.winner{

  transform:
    scale(1.08);

  box-shadow:
    0 0 44px gold,
    0 10px 24px rgba(0,0,0,0.2);
}

/* START */

#startBtn{

  position:absolute;

  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  width:280px;
  height:78px;

  border:none;
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ffbfd7,
      #ffd98c
    );

  color:white;

  font-size:36px;

  font-family:'Panda',sans-serif;

  cursor:pointer;

  z-index:300;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.2);
}

/* WINNER */

#winnerScreen{

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    rgba(255,255,255,0.24);

  backdrop-filter:blur(10px);

  opacity:0;
  pointer-events:none;

  transition:1s;

  z-index:500;
}

#winnerScreen.show{
  opacity:1;
}

#winnerScreen h1{

  font-size:130px;

  color:#ffbf00;

  text-shadow:
    0 0 20px white,
    0 0 40px gold;
}

#winnerScreen h2{

  margin-top:-10px;

  font-size:82px;

  color:#ff9800;
}

#winnerScreen p{

  margin-top:8px;

  font-size:42px;

  color:#5d5752;
}

/* 紙吹雪 */

.confetti{

  position:absolute;

  width:14px;
  height:14px;

  border-radius:4px;

  animation:fall linear forwards;
}

@keyframes fall{

  0%{
    transform:
      translateY(-100px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(900px)
      rotate(720deg);
  }
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">
<div class="overlay"></div>

<div class="title">
  <h1>わんも～杯 推し犬レース</h1>
  <p>投票人数ランキング</p>
</div>

<div class="trackArea">

  <div class="goal"></div>

  <!-- ダックス -->

  <div class="lane">

    <div class="runner"
    id="dachs"
    style="background:#ffb27d;">

      <div class="icon">
        <img src="dachs.png">
      </div>

      ダックスフンド

    </div>

    <div class="rank"
    id="rank-dachs">
      5位
    </div>

  </div>

  <!-- シュナ -->

  <div class="lane">

    <div class="runner"
    id="schna"
    style="background:#aeb5ff;">

      <div class="icon">
        <img src="schna.png">
      </div>

      シュナウザー

    </div>

    <div class="rank"
    id="rank-schna">
      4位
    </div>

  </div>

  <!-- マルトイプー -->

  <div class="lane">

    <div class="runner"
    id="maltipoo"
    style="background:#ffcfe6;">

      <div class="icon">
        <img src="maltipoo.png">
      </div>

      マルトイプー

    </div>

    <div class="rank"
    id="rank-maltipoo">
      3位
    </div>

  </div>

  <!-- 柴犬 -->

  <div class="lane">

    <div class="runner"
    id="shiba"
    style="background:#ff9f69;">

      <div class="icon">
        <img src="shiba.png">
      </div>

      柴犬

    </div>

    <div class="rank"
    id="rank-shiba">
      🥇1位
    </div>

  </div>

  <!-- キャバリア -->

  <div class="lane">

    <div class="runner"
    id="cavalier"
    style="background:#ffb8d8;">

      <div class="icon">
        <img src="cavalier.png">
      </div>

      キャバリア

    </div>

    <div class="rank"
    id="rank-cavalier">
      2位
    </div>

  </div>

</div>

<button id="startBtn">
START
</button>

<div id="winnerScreen">

  <h1>🥇</h1>

  <h2>
    柴犬
  </h2>

  <p>
    22人
  </p>

</div>

<script>

/* 距離線 */

const trackArea =
document.querySelector('.trackArea');

for(let i=1;i<=10;i++){

  const mark =
  document.createElement('div');

  mark.className='mark';

  mark.style.left =
    (i*100)+'px';

  mark.innerHTML =
  `<div class="markText">${i*100}</div>`;

  trackArea.appendChild(mark);
}

/* 犬 */

const dogs = [

{
  id:'dachs',
  x:0,
  speed:1.45,
  final:760
},

{
  id:'schna',
  x:0,
  speed:1.8,
  final:860
},

{
  id:'maltipoo',
  x:0,
  speed:2.15,
  final:940
},

{
  id:'cavalier',
  x:0,
  speed:2.45,
  final:1030
},

{
  id:'shiba',
  x:0,
  speed:2.2,
  final:1080
}

];

let running = false;

document
.getElementById('startBtn')
.onclick = ()=>{

  document
  .getElementById('startBtn')
  .style.display='none';

  running = true;

  animate();
};

function animate(){

  if(!running)return;

  let finished = 0;

  dogs.forEach((d,index)=>{

    const el =
    document.getElementById(d.id);

    /* 柴犬ラストスパート */

    if(
      d.id==='shiba'
      && d.x > 700
    ){
      d.speed += 0.015;
    }

    /* 微ランダム */

    d.speed +=
      (Math.random()-0.5)*0.04;

    d.speed =
      Math.max(1.2,d.speed);

    d.x += d.speed;

    if(d.x >= d.final){

      d.x = d.final;
      finished++;
    }

    el.style.transform =
    `
    translateX(${d.x}px)
    translateY(${Math.sin(Date.now()/90 + index)*2}px)
    `;
  });

  /* 終了 */

  if(finished >= dogs.length){

    finishRace();

    return;
  }

  requestAnimationFrame(animate);
}

/* 終了演出 */

async function finishRace(){

  running = false;

  const order = [
    'dachs',
    'schna',
    'maltipoo',
    'cavalier',
    'shiba'
  ];

  for(let id of order){

    document
    .getElementById(
      'rank-'+id
    )
    .classList.add('show');

    if(id!=='shiba'
    && id!=='cavalier'){

      document
      .getElementById(id)
      .classList.add('out');
    }

    await sleep(700);
  }

  document
  .getElementById('shiba')
  .classList.add('winner');

  confetti();

  await sleep(1200);

  document
  .getElementById('winnerScreen')
  .classList.add('show');
}

/* 紙吹雪 */

function confetti(){

  for(let i=0;i<160;i++){

    const c =
    document.createElement('div');

    c.className='confetti';

    c.style.left =
      Math.random()*1280+'px';

    c.style.background =
      `hsl(${Math.random()*360},90%,70%)`;

    c.style.animationDuration =
      (3 + Math.random()*3)+'s';

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },6000);
  }
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
